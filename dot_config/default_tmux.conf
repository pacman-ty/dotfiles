# ==========================================
# SYSTEM, TERMINAL & PROTOCOL SETTINGS
# ==========================================

# Use the default prefix: Ctrl + b
set -g prefix C-b
bind C-b send-prefix

# Open the tmux command prompt
bind : command-prompt

# List all current key bindings
bind ? list-keys

# Show previous status/system messages from tmux
bind ~ show-messages

# Force a redraw of the attached client
bind r refresh-client

# Display the current time in the center of the pane
bind t clock-mode


# ==========================================
# SESSION MANAGEMENT
# ==========================================

# Rename the current session
bind \$ command-prompt -I "#S" "rename-session '%%'"

# Interactively select a new session (Tree view)
bind s choose-tree -s

# Switch the attached client to the last used session
bind L switch-client -l

# Switch the client to the previous / next session
bind \( switch-client -p
bind \) switch-client -n

# Detach the current client from this session
bind d detach-client

# Interactively choose a specific client to detach
bind D choose-client


# ==========================================
# WINDOWS MANAGEMENT
# ==========================================

# Create a brand new window
bind c new-window

# Rename the current window
bind , command-prompt -I "#W" "rename-window '%%'"

# Prompt for an index to move the position of the current window
bind . command-prompt "move-window -t '%%'"

# Move to the previously selected window
bind l last-window

# Move to the next / previous window
bind n next-window
bind p previous-window

# Interactively search for text across all open windows
bind f command-prompt "find-window '%%'"

# Interactively choose the current window/pane from a list
bind w choose-tree -w

# Prompt for a window index number to jump to
bind "'" command-prompt -p "index" "select-window -t '%%'"

# Select windows 0 through 9 directly
bind 0 select-window -t 0
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Move to windows containing alert activity (bell or monitor markers)
bind -n M-n next-window -a
bind -n M-p previous-window -a

# Kill (close) the current window entirely (requires confirmation)
bind \& confirm-before -p "kill-window #W? (y/n)" kill-window


# ==========================================
# PANES MANAGEMENT
# ==========================================

# Split panes: " for horizontal (top/bottom) and % for vertical (left/right)
bind '"' split-window -v
bind %   split-window -h

# Break the current pane out into its own separate window
bind ! break-pane

# Switch focus to the pane above, below, left, or right
bind Up    select-pane -U
bind Down  select-pane -D
bind Left  select-pane -L
bind Right select-pane -R

# Move focus to the next pane / previously active pane
bind o select-pane -t :.+
bind \; last-pane

# Briefly flash and display individual pane indexes
bind q display-panes

# Toggle zoom state (maximize / minimize) of the current pane
bind z resize-pane -Z

# Swap the current pane with the previous / next pane
bind \{ swap-pane -U
bind \} swap-pane -D

# Rotate the panes inside the current window forwards / backwards
bind C-o rotate-window
bind -n M-o rotate-window -D

# Mark a pane / Clear the marked pane flag
bind m select-pane -m
bind M select-pane -M

# Kill (close) the current active pane only (requires confirmation)
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# Display internal technical details about the current window
bind i display-message


# ==========================================
# LAYOUTS & RESIZING
# ==========================================

# Cycle the current window through the preset layout structures
bind Space next-layout

# Arrange panes into one of the preset system layouts
bind -n M-1 select-layout even-horizontal
bind -n M-2 select-layout even-vertical
bind -n M-3 select-layout main-horizontal
bind -n M-4 select-layout main-vertical
bind -n M-5 select-layout tiled

# Fine-grained pane resizing (Steps of 1 cell)
bind -r C-Up    resize-pane -U 1
bind -r C-Down  resize-pane -D 1
bind -r C-Left  resize-pane -L 1
bind -r C-Right resize-pane -R 1

# Coarse-grained pane resizing (Steps of 5 cells)
bind -r M-Up    resize-pane -U 5
bind -r M-Down  resize-pane -D 5
bind -r M-Left  resize-pane -L 5
bind -r M-Right resize-pane -R 5


# ==========================================
# NATIVE COPY MODE (EMACS DEFAULTS)
# ==========================================

# Enter text copy mode / view scrollback history
bind [ copy-mode
bind PageUp copy-mode -u

# Paste the most recently copied buffer of text
bind ] paste-buffer

# Interactively choose a specific text buffer to paste from a list
bind = choose-buffer

# Delete the most recently copied buffer of text from history
bind - delete-buffer

# Core selection defaults inside Emacs copy-mode (implicit table)
bind-key -T copy-mode C-Space send-keys -X begin-selection
bind-key -T copy-mode M-w     send-keys -X copy-selection-and-cancel
bind-key -T copy-mode C-g     send-keys -X clear-selection
bind-key -T copy-mode Escape  send-keys -X cancel


# ==========================================
# TREE-VIEW / MODE NAV DEFAULTS (IMPLICIT)
# ==========================================

# These keys control interactive lists (like when pressing Prefix + w or s)
bind-key -T choose-tree Up    send-keys -X up
bind-key -T choose-tree Down  send-keys -X down
bind-key -T choose-tree Left  send-keys -X collapse
bind-key -T choose-tree Right send-keys -X expand
bind-key -T choose-tree Enter send-keys -X select
bind-key -T choose-tree q     send-keys -X cancel
