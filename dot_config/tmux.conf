# ==========================================
# SYSTEM & TERMINAL SETTINGS
# ==========================================

# True color and 256 color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# Enable mouse and system clipboard integration
set -g mouse on
set -g set-clipboard on

# Window and pane numbering (1-based for keyboard comfort)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Reduce Esc delay (important for Neovim)
set -sg escape-time 10

# Increase scrollback buffer (default is 2000)
set -g history-limit 50000

# ==========================================
# KEY BINDINGS & PREFIX
# ==========================================

# Set new prefix (Ctrl + Space)
unbind C-b 
set -g prefix C-Space
bind C-Space send-prefix

# Reload config file quickly (Prefix + r)
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ==========================================
# PANES MANAGEMENT
# ==========================================

# Split panes using open in current path
# Verical split (prefix \)
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
# Horizontal split (prefix -)
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Vim-like pane switching (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Vim-like pane swapping (Alt + Shift + hjkl)
bind -n M-H run "tmux swap-pane -s {left-of}"
bind -n M-J run "tmux swap-pane -s {down-of}"
bind -n M-K run "tmux swap-pane -s {up-of}"
bind -n M-L run "tmux swap-pane -s {right-of}"

# ==========================================
# CUSTOM VERTICAL & HORIZONTAL LAYOUTS
# ==========================================

# Define primary pane sizes (70% of screen space)
set -g main-pane-width "70%"
set -g main-pane-height "70%"

# Flatten panes evenly top-to-bottom (prefix j)
bind j select-layout even-vertical
# Make primary focus window on top (prefix Shift + j)
bind J select-layout main-horizontal

# Flatten panes evenly side-by-side (prefix k)
bind k select-layout even-horizontal
# Make primary focus window on left (prefix Shift + k)
bind K select-layout main-vertical


# ==========================================
# WINDOWS MANAGEMENT
# ==========================================

# Vim-like window switching: (Prefix + hl)
bind h previous-window
bind l next-window

# Vim-like window swapping (Prefix + Shift + hl)
bind H swap-window -t -1 \; select-window -t -1
bind L swap-window -t +1 \; select-window -t +1

# Quick window navigation (Shift + Arrow)
bind -n S-Left previous-window
bind -n S-Right next-window 

# Quick window selection (Alt + Number)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


# ==========================================
# COPY MODE (VI-STYLE)
# ==========================================

# Vim-like selection and copying
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Prevent mouse drag from instantly exiting copy mode
unbind -T copy-mode-vi MouseDragEnd1Pane

# Use Vi-style keys in copy mode
set-window-option -g mode-keys vi
